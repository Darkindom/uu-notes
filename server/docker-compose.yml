version: '3.8'

services:
  uu-notes-server:
    build: .
    container_name: uu-notes-server
    restart: unless-stopped
    ports:
      - '1717:1717'
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 持久化日志
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:1717/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 不需要 nginx，使用 Cloudflare Tunnel
# networks:
#   default:
#     name: uu-notes-network
