version: '3.8'

services:
  uu-notes-server:
    build: .
    container_name: uu-notes-server
    restart: unless-stopped
    ports:
      - '1717:1717'
    volumes:
      # 持久化数据库
      - ./data:/app/data
      # 挂载环境变量
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:1717/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加 Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: uu-notes-nginx
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - uu-notes-server

networks:
  default:
    name: uu-notes-network
